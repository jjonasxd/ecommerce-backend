<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código de Verificação</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f4f6f8; padding:20px 0;">
    <tr>
      <td align="center">

        <table role="presentation" width="100%" max-width="600" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden; max-width:600px;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1f2937; padding:20px; text-align:center;">
              <h1 style="color:#ffffff; margin:0; font-size:20px;">Verificação de Segurança</h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:30px; color:#111827; text-align:center;">
              <p style="font-size:16px; margin:0 0 10px;">
                Use o código abaixo para concluir sua verificação:
              </p>

              <p style="font-size:32px; font-weight:bold; letter-spacing:6px; margin:20px 0; color:#1f2937;">
                {{ codigo_email }}
              </p>

              <p style="font-size:14px; color:#6b7280; margin:0;">
                Este código é válido por 10 minutos. Não compartilhe com ninguém.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px; text-align:center; font-size:12px; color:#9ca3af; background-color:#f9fafb;">
              Se você não solicitou este código, pode ignorar este e-mail.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
<!-- Usei ia em tudo-->
